<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Funely</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: presenter shell (notas UX + teléfono) para la familia; intranet a ancho completo para el gestor. Tema claro deliberado. */
:root{
  color-scheme: light;
  --teal:#016D79; --teal-700:#01545D; --teal-50:#EAF4F5; --teal-100:#D2E8EA;
  --sand:#EDC07C; --sand-50:#FCF5EA; --sand-700:#8A5A12;
  --ink:#16313A; --ink-2:#4B6269; --ink-3:#6E8389;
  --line:#DCE7E8; --bg:#F3F7F7; --surface:#FFFFFF; --frame:#22363C;
  --ok:#22704A; --ok-50:#E6F3EC; --warn:#8F5300; --warn-50:#FFF3DE;
  --err:#B3261E; --err-50:#FCEAE8; --info:#255E9C; --info-50:#E8F0FA;
  --display:"Lexend", "Segoe UI", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --r:14px; --r-sm:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sand);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance;color:var(--ink)}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Phone ---------- */
.phone{width:390px;height:min(820px,calc(100vh - 120px));min-height:640px;border:11px solid var(--frame);border-radius:46px;background:var(--surface);
  overflow:hidden;box-shadow:0 30px 60px -20px rgba(22,49,58,.35),0 0 0 1px rgba(22,49,58,.06);position:relative;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;background:var(--surface)}
.apphead{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid transparent}
.apphead .logo{font-size:22px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--teal-50)}
.help{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px;color:var(--teal-700);font-weight:700;min-height:40px}
.stepper{padding:2px 20px 12px}
.stepper ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepper li{font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px}
.stepper li::before{content:"";height:5px;border-radius:5px;background:var(--line)}
.stepper li.done::before{background:var(--teal)}
.stepper li.cur::before{background:linear-gradient(90deg,var(--teal) 50%,var(--teal-100) 50%)}
.stepper li.cur{color:var(--ink);font-weight:700}
.scroll>*{flex-shrink:0}
.scroll{flex:1;overflow:auto;padding:8px 20px 24px;display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth}
.cta{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.btn{min-height:54px;border-radius:14px;border:0;padding:0 20px;font-family:var(--display);font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-700)}
.btn.primary:disabled{background:#B7CBCE;color:#F4F8F8;cursor:not-allowed}
.btn.secondary{background:var(--teal-50);color:var(--teal-700)}
.btn.outline{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{min-height:44px;font-size:15px;width:auto;border-radius:11px;padding:0 14px}
.linkbtn{border:0;background:none;color:var(--teal-700);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-size:15px}
.cta .hint{font-size:13px;color:var(--ink-3);text-align:center}

.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.lead{color:var(--ink-2);font-size:16.5px}
.h1{font-size:28px;font-weight:600;letter-spacing:-.01em}
.h2{font-size:22px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:8px}
.stack-l{display:flex;flex-direction:column;gap:14px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface)}
.card.tint{background:var(--teal-50);border-color:var(--teal-100)}
.card.sand{background:var(--sand-50);border-color:#F3DDB5}

/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-weight:700;font-size:15px}
.field .opt{font-weight:400;color:var(--ink-3)}
.input{min-height:52px;border:1.5px solid #C9D8DA;border-radius:12px;padding:0 14px;background:var(--surface);font-size:17px;width:100%}
.input:focus{border-color:var(--teal);outline:3px solid var(--teal-100);outline-offset:0}
.input.auto{background:#FFFBF2;border-color:var(--sand)}
.input.big{font-family:var(--display);font-size:24px;letter-spacing:.12em;min-height:60px}
.hint{font-size:14px;color:var(--ink-3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;border-radius:99px;border:1.5px solid #C9D8DA;background:var(--surface);padding:0 16px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;font-size:15px;color:var(--ink-2);cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--teal);flex:none;margin:0}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid #C9D8DA;background:var(--surface);border-radius:var(--r);padding:16px}
.choice .dot{width:22px;height:22px;border-radius:50%;border:2px solid #9FB6B9;flex:none;margin-top:2px;display:grid;place-items:center}
.choice[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-50);box-shadow:inset 0 0 0 1px var(--teal)}
.choice[aria-pressed="true"] .dot{border-color:var(--teal)}
.choice[aria-pressed="true"] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--teal)}
.choice strong{font-family:var(--display);font-weight:600;font-size:16.5px;display:block;color:var(--ink)}
.choice span{font-size:14.5px;color:var(--ink-2)}

.scan{display:flex;gap:14px;align-items:center}
.scan .ic{width:48px;height:48px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--teal);flex:none;border:1px solid var(--teal-100)}
.scan p{font-size:14.5px;color:var(--ink-2)}
.scan strong{display:block;color:var(--ink);font-size:15.5px}

/* price */
.price{font-family:var(--display);font-weight:700;font-size:46px;letter-spacing:-.02em;color:var(--teal-700);line-height:1;font-variant-numeric:tabular-nums}
.price small{font-size:20px;font-weight:600}
.incl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.incl li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.incl svg{color:var(--teal);flex:none;margin-top:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:700;text-align:right;min-width:0}
.place{display:flex;gap:12px;align-items:flex-start}
.place .ic{width:40px;height:40px;border-radius:10px;background:var(--teal-50);color:var(--teal);display:grid;place-items:center;flex:none}
.place small{display:block;color:var(--ink-3);font-size:13px}

.trust{display:grid;gap:10px}
.trust div{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink-2)}
.trust svg{color:var(--teal);flex:none}
.urgent{display:flex;gap:12px;align-items:center;border-radius:var(--r);padding:14px 16px;background:var(--sand-50);border:1px solid #F3DDB5}
.urgent strong{display:block;font-size:15px}
.urgent span{font-size:14px;color:var(--ink-2)}
.tel{font-family:var(--display);font-weight:600;color:var(--teal-700);user-select:all}

/* documents */
.doc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.doc>button{width:100%;border:0;background:var(--surface);display:flex;gap:12px;align-items:center;padding:14px;text-align:left}
.doc .ic{width:42px;height:42px;border-radius:10px;background:var(--teal-50);color:var(--teal);display:grid;place-items:center;flex:none}
.doc strong{display:block;font-size:15.5px}
.doc .meta{font-size:13.5px;color:var(--ink-3)}
.doc .chev{margin-left:auto;color:var(--ink-3);transition:transform .2s}
.doc[data-open="true"] .chev{transform:rotate(180deg)}
.paper{background:#EEF2F2;padding:14px}
.sheet{background:#fff;box-shadow:0 2px 8px rgba(22,49,58,.12);padding:16px 14px;font-size:10.5px;line-height:1.45;color:#333;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;gap:8px}
.sheet .sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;border-bottom:1px solid #ccc;padding-bottom:8px}
.sheet .sh-title{font-weight:700;font-size:11.5px;text-transform:uppercase;color:#222}
.sheet .box{border:1px solid #999;padding:6px 8px}
.sheet .box b{color:#8DB933;font-size:10px;display:block;margin-bottom:2px}
.sheet .fill{background:#FFF1D3;border-bottom:1.5px solid var(--sand);padding:0 3px;font-weight:700;color:#222}
.sheet .later{background:var(--teal-50);border-bottom:1.5px dashed var(--teal);padding:0 3px;color:var(--teal-700)}
.sheet .tline{display:flex;justify-content:space-between;border-top:1px solid #ddd;padding-top:4px}
.sheet .sign{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .sign div{border:1px solid #bbb;height:46px;padding:3px 5px;color:#888;font-size:9px;position:relative}
.sheet .sign img{position:absolute;inset:10px 6px 2px;height:32px;object-fit:contain}
.tanlogo{display:flex;align-items:center;gap:5px;font-weight:700;color:#4F5F6F;font-size:11px}
.tanlogo i{width:18px;height:18px;border-radius:4px;background:#4F5F6F;display:inline-block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}

/* signature */
.signit{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.signit b{font-family:var(--display);color:#3A4A9F;font-weight:600}
.pad{position:relative;border:1.5px dashed #9FB6B9;border-radius:var(--r);background:#FCFDFD;height:170px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block;border-radius:var(--r)}
.pad .ph{position:absolute;inset:auto 16px 16px;border-top:1.5px solid #C9D8DA;padding-top:6px;font-size:13px;color:var(--ink-3);pointer-events:none}

/* upload */
.up{display:flex;flex-direction:column;gap:12px}
.up-head{display:flex;gap:12px;align-items:center}
.up-head .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--teal-50);color:var(--teal)}
.up-head strong{display:block;font-size:16px}
.up .actions{display:flex;gap:8px;flex-wrap:wrap}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* status */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-50);color:var(--ok)}
.pill.warn{background:var(--warn-50);color:var(--warn)}
.pill.err{background:var(--err-50);color:var(--err)}
.pill.info{background:var(--info-50);color:var(--info)}
.pill.neutral{background:#EEF2F3;color:var(--ink-2)}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:14px 16px;font-size:15px}
.alert svg{flex:none;margin-top:2px}
.alert.warn{background:var(--warn-50);color:#5E3700}
.alert.err{background:var(--err-50);color:#7A1A14}
.alert.ok{background:var(--ok-50);color:#174D33}
.alert.info{background:var(--info-50);color:#1A426E}
.alert strong{display:block}
.alert .linkbtn{color:inherit;font-size:14.5px;padding:4px 0 0}

/* dashboard */
.prog{display:flex;flex-direction:column;gap:10px}
.bar{height:12px;border-radius:12px;background:var(--teal-100);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:12px;transition:width .5s}
.bar.sm{height:7px}
.pct{font-family:var(--display);font-weight:700;font-size:34px;color:var(--teal-700);font-variant-numeric:tabular-nums;line-height:1}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.todo li:last-child{border-bottom:0}
.todo .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid #C9D8DA;color:#fff}
.todo li.done .st{background:var(--teal);border-color:var(--teal)}
.todo li.done span:not(.st){color:var(--ink-2)}
.todo li.bad .st{background:var(--err);border-color:var(--err)}
.todo li .linkbtn{margin-left:auto;font-size:14px}
.wa{display:flex;gap:12px;align-items:center}
.wa .ic{width:46px;height:46px;border-radius:50%;background:#E3F5EA;color:#1E8E4E;display:grid;place-items:center;flex:none}
.success{width:84px;height:84px;border-radius:50%;background:var(--ok-50);color:var(--ok);display:grid;place-items:center;margin:8px auto 0}
.steps-v{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.steps-v li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:16px;position:relative}
.steps-v li::after{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--teal-100)}
.steps-v li:last-child::after{display:none}
.steps-v .n{width:28px;height:28px;border-radius:50%;background:var(--teal-50);color:var(--teal-700);font-family:var(--display);font-weight:600;font-size:13px;display:grid;place-items:center}
.steps-v li.now .n{background:var(--teal);color:#fff}
.steps-v strong{display:block;font-size:15.5px}
.steps-v span{font-size:14px;color:var(--ink-2)}

.toast{position:absolute;left:16px;right:16px;bottom:100px;z-index:20;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:15px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
.example{font-size:12px;color:var(--sand-700);background:var(--sand-50);border-radius:6px;padding:2px 8px;align-self:flex-start}

/* ---------- Home ---------- */
.hero{margin:-8px -20px 0;padding:22px 20px 26px;background:linear-gradient(180deg,var(--sand-50),var(--surface));display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero>*{position:relative}
.hero .h1{font-size:30px}
.hero .deco{position:absolute;right:-34px;top:-30px;width:150px;height:150px;opacity:.45;pointer-events:none}
.cpbox{display:flex;gap:8px}.cpbox .input{flex:1;min-width:0}.cpbox .btn{flex:none;min-height:52px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec .h2{font-size:22px}
.sec>p{color:var(--ink-2)}
.benefits{display:grid;gap:16px}
.benefit{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.benefit .ic{width:44px;height:44px;border-radius:12px;background:var(--teal-50);color:var(--teal);display:grid;place-items:center}
.benefit strong{display:block;font-family:var(--display);font-weight:600;font-size:16.5px}
.benefit p{font-size:15px;color:var(--ink-2)}
.situ{display:grid;gap:10px}
.situ strong{font-family:var(--display);font-weight:600;font-size:17px;display:block;margin-bottom:4px}
.situ p{font-size:15px;color:var(--ink-2)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;cursor:pointer;list-style:none;padding:6px 0}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;font-weight:300;color:var(--teal);flex:none}
.faq details[open] summary::after{content:"–"}
.faq details p{padding:0 0 14px;color:var(--ink-2);font-size:15px}
.foot{margin:8px -20px -24px;padding:24px 20px 28px;background:var(--teal-50);display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--ink-2)}
.foot .links{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}

/* ---------- Admin ---------- */
.admin{flex:1;display:grid;grid-template-columns:232px 1fr;min-height:0}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.side .who{display:flex;gap:10px;align-items:center;padding:6px 8px 18px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sand-50);color:var(--sand-700);font-family:var(--display);font-weight:600;display:grid;place-items:center;flex:none;font-size:14px}
.side .who small{display:block;color:var(--ink-3);font-size:13px}
.side nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink-2);text-align:left;min-height:44px}
.side nav button[aria-current="true"]{background:var(--teal-50);color:var(--teal-700);font-weight:700}
.side nav .count{margin-left:auto;font-size:12px;background:var(--teal);color:#fff;border-radius:99px;padding:1px 8px}
.main{padding:24px 28px 40px;display:flex;flex-direction:column;gap:20px;min-width:0}
.mainhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.mainhead .h2{font-size:26px}
.mainhead p{color:var(--ink-3);font-size:15px}
.search{margin-left:auto;min-height:44px;border:1.5px solid #C9D8DA;border-radius:11px;padding:0 14px;background:var(--surface);min-width:0;width:260px;max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left}
.kpi b{font-family:var(--display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:14px;color:var(--ink-2)}
.kpi.warnk b{color:var(--warn)} .kpi.infok b{color:var(--info)} .kpi.okk b{color:var(--ok)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters .chip{min-height:38px;font-size:14px;padding:0 13px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px);gap:18px;align-items:start}
.split.nodetail{grid-template-columns:minmax(0,1fr)}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{text-align:left;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
td:first-child{white-space:nowrap}
.split:not(.nodetail) .hide-d{display:none}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F8FBFB}
tbody tr[aria-selected="true"]{background:var(--teal-50)}
td .sub{display:block;font-size:13px;color:var(--ink-3)}
td.num{font-variant-numeric:tabular-nums}
.mode{font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 7px}
.mode.inm{background:var(--sand-50);color:var(--sand-700)}
.mode.prev{background:#EEF2F3;color:var(--ink-2)}
.livebadge{font-size:11px;font-weight:700;color:#fff;background:var(--teal);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.mini{display:flex;align-items:center;gap:8px;min-width:110px}
.mini .bar{flex:1}
.mini small{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12.5px;width:34px}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto}
.dhead{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dhead .top{display:flex;gap:8px;align-items:center}
.dhead .id{font-family:var(--display);font-weight:600;font-size:18px;white-space:nowrap}
.dactions{display:flex;gap:8px;flex-wrap:wrap}
.dsec{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dsec:last-child{border-bottom:0}
.dsec h4{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.dkv{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;font-size:14.5px}
.dkv dt{color:var(--ink-3)} .dkv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.drow{display:flex;gap:10px;align-items:center;font-size:14.5px;flex-wrap:wrap}
.drow .nm{flex:1;min-width:140px}
.drow .nm small{display:block;color:var(--ink-3);font-size:12.5px}
.reasons{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding:8px;background:var(--err-50);border-radius:10px}
.reasons .chip{min-height:36px;font-size:13.5px;border-color:#E9B8B3}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.tl li{display:grid;grid-template-columns:76px 1fr;gap:10px}
.tl time{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:13px}
.sf{display:flex;flex-direction:column;gap:8px;font-size:14px}
.sf div{display:flex;gap:10px;align-items:center}
.sf code{font-size:12.5px;background:#EEF2F3;border-radius:5px;padding:1px 6px;color:var(--ink-2)}
.sf .ok{color:var(--ok)} .sf .pend{color:var(--ink-3)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.adminbanner{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-2);background:var(--sand-50);border:1px solid #F3DDB5;border-radius:12px;padding:10px 14px}

/* =====================================================================
   v2 · Tres capas con identidad propia:
   1) Web pública (landing comercial)  2) Contratación (checkout con resumen)
   3) Área privada (intranet con secciones)  + Panel del gestor
   ===================================================================== */
:root{ --teal-900:#0B3B41; --teal-800:#0E4C54; --wrap:1120px }
body{background:var(--surface)}
a{color:inherit}
.logo{display:inline-flex;align-items:flex-start;font-family:var(--display);font-weight:700;color:var(--teal);letter-spacing:-.02em;font-size:24px;line-height:1}
.logo svg{width:.4em;height:.4em;margin-left:1px;margin-top:-.12em;flex:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:20px;padding-right:20px}

/* Botones */
.btn{width:auto;min-height:48px;border-radius:12px;border:0;padding:0 20px;font-family:var(--display);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.block{width:100%}
.btn.lg{min-height:56px;font-size:17px;padding:0 26px;border-radius:14px}
.btn.sm{min-height:40px;font-size:14.5px;padding:0 14px;border-radius:10px}
.btn.primary{background:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-700)}
.btn.primary:disabled{background:#B7CBCE;color:#F4F8F8;cursor:not-allowed}
.btn.secondary{background:var(--teal-50);color:var(--teal-700)}
.btn.secondary:hover{background:var(--teal-100)}
.btn.outline{background:var(--surface);border:1.5px solid #C9D8DA;color:var(--ink)}
.btn.outline:hover{border-color:var(--teal);color:var(--teal-700)}
.btn.white{background:#fff;color:var(--teal-800)}
.btn.ghostw{background:transparent;border:1.5px solid rgba(255,255,255,.45);color:#fff}
.btn.sandb{background:var(--sand);color:#3B2A0C}
.toast{position:fixed;left:16px;right:16px;margin:0 auto;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:100;max-width:420px;width:auto}

/* ---------------- 1 · WEB PÚBLICA ---------------- */
.site-h{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.site-h .wrap{display:flex;align-items:center;gap:28px;min-height:70px}
.site-h .logo{font-size:26px}
.site-nav{display:flex;gap:4px}
.site-nav button{border:0;background:none;padding:10px 12px;border-radius:10px;font-size:15px;color:var(--ink-2)}
.site-nav button:hover{color:var(--ink);background:var(--teal-50)}
.site-act{margin-left:auto;display:flex;gap:10px;align-items:center}
.site-tel{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;margin-right:6px}
.site-tel small{font-size:12px;color:var(--ink-3)}
.site-tel b{font-family:var(--display);font-weight:600;color:var(--teal-700);font-size:17px}
.iconbtn.round{border:1.5px solid var(--line);border-radius:12px;color:var(--teal-700)}

.l-hero{position:relative;overflow:hidden;background:radial-gradient(900px 460px at 88% -8%,#FBEFD9 0%,rgba(251,239,217,0) 62%),linear-gradient(180deg,#F4F9F9 0%,#fff 100%);padding:64px 0 72px}
.l-hero .star{position:absolute;right:4%;top:40px;width:120px;height:120px;opacity:.6;pointer-events:none}
.l-hero-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:56px;align-items:center;position:relative}
.l-eyebrow{display:inline-flex;line-height:1.35;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-700);background:#fff;border:1px solid var(--teal-100);border-radius:99px;padding:6px 12px}
.l-h1{font-family:var(--display);font-size:clamp(36px,5.2vw,60px);font-weight:600;letter-spacing:-.025em;line-height:1.05;margin:18px 0 18px;text-wrap:balance}
.l-h1 em{font-style:normal;color:var(--teal)}
.l-lead{font-size:clamp(17px,1.5vw,19.5px);color:var(--ink-2);max-width:32em;line-height:1.55}
.l-points{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-wrap:wrap;gap:10px 22px;font-size:15px;color:var(--ink)}
.l-points li{display:flex;gap:8px;align-items:center}
.l-points svg{color:var(--teal)}
.l-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.l-calc{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 30px 70px -36px rgba(1,84,93,.5);display:flex;flex-direction:column;gap:14px}
.l-calc h2{font-size:21px;font-weight:600}
.l-calc .sub{font-size:14.5px;color:var(--ink-3)}
.l-res{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.l-res .p{font-family:var(--display);font-weight:700;font-size:44px;color:var(--teal-700);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.l-res .p small{font-size:18px;font-weight:600}
.l-res dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14.5px}
.l-res dt{color:var(--ink-3)} .l-res dd{margin:0;font-weight:600}

.l-trust{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}
.l-trust .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.l-trust div.it{display:flex;gap:12px;align-items:center;padding:22px 18px;border-left:1px solid var(--line)}
.l-trust div.it:first-child{border-left:0;padding-left:0}
.l-trust .ic{width:42px;height:42px;border-radius:12px;background:var(--teal-50);color:var(--teal);display:grid;place-items:center;flex:none}
.l-trust strong{display:block;font-family:var(--display);font-weight:600;font-size:15.5px}
.l-trust span{font-size:13.5px;color:var(--ink-3)}

.l-sec{padding:84px 0}
.l-sec.alt{background:#F4F8F8}
.l-kicker{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sand-700);margin-bottom:12px;display:block}
.l-h2{font-family:var(--display);font-size:clamp(28px,3.4vw,42px);font-weight:600;letter-spacing:-.02em;line-height:1.12;text-wrap:balance}
.l-p{font-size:17px;color:var(--ink-2);line-height:1.6;max-width:36em}
.l-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
.l-head{display:flex;flex-direction:column;gap:14px;max-width:720px;margin-bottom:40px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fact{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.fact b{display:block;font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:4px}
.fact span{font-size:14.5px;color:var(--ink-2)}
.fact.yes{border-color:var(--teal-100)} .fact.no{background:#FAFBFB}
.fact .tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;display:inline-block;padding:2px 8px;border-radius:6px}
.fact.yes .tag{background:var(--teal-50);color:var(--teal-700)} .fact.no .tag{background:#EEF2F3;color:var(--ink-3)}

.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;counter-reset:s}
.stepc{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;gap:10px;position:relative}
.stepc .num{font-family:var(--display);font-size:52px;font-weight:300;line-height:1;color:var(--sand);letter-spacing:-.04em}
.stepc h3{font-size:19px;font-weight:600}
.stepc p{color:var(--ink-2);font-size:15.5px}
.stepc .time{margin-top:auto;font-size:13px;color:var(--teal-700);font-weight:600;display:flex;gap:6px;align-items:center;padding-top:8px}

.l-price{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:40px;align-items:stretch}
.incl2{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.incl2 li{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.incl2 svg{color:var(--teal);flex:none;margin-top:3px}
.pcard{background:var(--teal-900);color:#E3EFF0;border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.pcard .from{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#9CC4C8}
.pcard .p{font-family:var(--display);font-weight:700;font-size:64px;color:#fff;line-height:1;letter-spacing:-.03em}
.pcard .p small{font-size:24px;font-weight:600}
.pcard ul{list-style:none;padding:0;margin:4px 0 8px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.pcard li{display:flex;gap:8px;align-items:center}
.pcard li svg{color:var(--sand)}
.pcard .glow{position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;opacity:.18}

.moments{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.moment{border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:#fff}
.moment.now{background:var(--sand-50);border-color:#F1DBB4}
.moment .tag{align-self:flex-start;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.moment h3{font-size:24px;font-weight:600}
.moment p{color:var(--ink-2);font-size:16px}
.moment .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:6px}

.l-faq{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-weight:600;font-size:17px;cursor:pointer;list-style:none;padding:8px 0}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:26px;font-weight:300;color:var(--teal);flex:none;width:24px;text-align:center}
.faq details[open] summary::after{content:"–"}
.faq details p{padding:0 0 18px;color:var(--ink-2);font-size:16px;max-width:40em}

.l-cta{background:var(--teal);color:#fff;padding:64px 0}
.l-cta .wrap{display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap}
.l-cta h2{color:#fff;font-size:clamp(26px,3vw,36px);font-weight:600;max-width:18em}
.l-cta p{color:#CFE6E8;margin-top:8px;font-size:17px}
.l-cta .acts{display:flex;gap:12px;flex-wrap:wrap}

.site-f{background:var(--teal-900);color:#B9D3D6;padding:56px 0 28px;font-size:14.5px}
.site-f .grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.site-f h4{color:#fff;font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;font-weight:600}
.site-f ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.site-f button{border:0;background:none;padding:0;color:inherit;font-size:inherit;text-align:left}
.site-f button:hover{color:#fff}
.site-f .logo{color:#fff;font-size:28px}
.site-f .legal{border-top:1px solid rgba(255,255,255,.12);margin-top:40px;padding-top:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:#8FB2B6}
.l-sticky{display:none}

/* ---------------- 2 · CONTRATACIÓN ---------------- */
.co{min-height:100dvh;background:#F6F9F9;display:flex;flex-direction:column}
.co-h{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.co-h .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;min-height:66px;max-width:1080px}
.co-h .left{display:flex;align-items:center;gap:6px}
.co-h .right{display:flex;justify-content:flex-end}
.co-steps{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:10px}
.co-steps li{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink-3)}
.co-steps li .n{width:26px;height:26px;border-radius:50%;border:1.5px solid #C9D8DA;display:grid;place-items:center;font-size:13px;font-weight:600;font-family:var(--display);background:#fff}
.co-steps li.done{color:var(--ink-2)} .co-steps li.done .n{background:var(--teal);border-color:var(--teal);color:#fff}
.co-steps li.cur{color:var(--ink);font-weight:600} .co-steps li.cur .n{border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 4px var(--teal-50)}
.co-steps .sep{width:36px;height:2px;background:var(--line);border-radius:2px}
.co-mbar{display:none}
.co-body{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:48px;max-width:1080px;width:100%;margin:0 auto;padding:40px 20px 64px;align-items:start}
.co-main{max-width:620px;width:100%;display:flex;flex-direction:column;gap:22px}
.co-main .h1{font-size:32px;letter-spacing:-.015em}
.co-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px}
.co-card>h2{font-size:18px;font-weight:600}
.co-actions{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.co-actions .hint{text-align:center}
.co-sum{position:sticky;top:96px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.co-sum h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.co-sum .svc{font-family:var(--display);font-weight:600;font-size:18px}
.co-sum .p{font-family:var(--display);font-weight:700;font-size:36px;color:var(--teal-700);line-height:1;font-variant-numeric:tabular-nums}
.co-sum .p small{font-size:16px;font-weight:600}
.co-sum hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.co-sum .sumhelp{font-size:14px;color:var(--ink-2);background:var(--sand-50);border-radius:12px;padding:12px 14px}
.co-sum-m{display:none}
.modechip{font-size:12.5px;font-weight:600;border-radius:6px;padding:3px 8px;background:var(--teal-50);color:var(--teal-700);align-self:flex-start}

/* ---------------- 3 · ÁREA PRIVADA ---------------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100dvh;background:#F3F7F7}
.app-side{position:sticky;top:0;height:100dvh;background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.app-side .logo{font-size:26px;padding:0 10px 4px}
.app-side .area{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 10px 18px;font-weight:600}
.app-nav{display:flex;flex-direction:column;gap:2px}
.app-nav button{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:11px;padding:11px 12px;font-size:15.5px;color:var(--ink-2);text-align:left;min-height:46px;position:relative}
.app-nav button:hover{background:#F3F7F7;color:var(--ink)}
.app-nav button[aria-current="page"]{background:var(--teal-50);color:var(--teal-700);font-weight:600}
.app-nav .badge{margin-left:auto;min-width:22px;height:22px;border-radius:99px;background:var(--sand);color:#3B2A0C;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.app-side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 10px;border-top:1px solid var(--line)}
.app-side .me small{display:block;color:var(--ink-3);font-size:12.5px}
.app-side .me .linkbtn{font-size:13px;padding:0}
.app-main{min-width:0;display:flex;flex-direction:column}
.app-top{position:sticky;top:0;z-index:20;background:rgba(243,247,247,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:16px 36px;border-bottom:1px solid transparent}
.app-top .crumb{font-size:14px;color:var(--ink-3)}
.app-top .crumb b{color:var(--ink);font-weight:600}
.app-top .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.app-top .mlogo{display:none}
.app-content{padding:8px 36px 56px;max-width:1120px;width:100%;display:flex;flex-direction:column;gap:22px}
.page-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-h h1{font-size:30px;font-weight:600;letter-spacing:-.015em}
.page-h p{color:var(--ink-3);font-size:15px;margin-top:4px}
.page-h .acts{margin-left:auto;display:flex;gap:10px}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.g2e{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px}
.panel-h h2{font-size:17px;font-weight:600}
.panel-h .linkbtn{margin-left:auto;font-size:14px;padding:0}
.hero-st{border-radius:22px;padding:26px;color:#fff;background:linear-gradient(135deg,var(--teal) 0%,var(--teal-800) 100%);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;position:relative;overflow:hidden}
.hero-st.ok{background:linear-gradient(135deg,#1F6E5A 0%,#0F4C3E 100%)}
.hero-st .lbl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:600}
.hero-st h2{color:#fff;font-size:24px;font-weight:600;margin:6px 0 6px}
.hero-st p{color:rgba(255,255,255,.85);font-size:15.5px;max-width:34em}
.hero-st .bar{background:rgba(255,255,255,.22);margin-top:16px;max-width:420px}

function setupPad(){
  const cv=document.getElementById("pad"); if(!cv) return;
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.lineWidth=2.6; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#1F2C6B";
  if(S.sigImg){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=S.sigImg;}
  let drawing=false,last=null;
  const pos=ev=>{const b=cv.getBoundingClientRect();return [ev.clientX-b.left,ev.clientY-b.top];};
  cv.addEventListener("pointerdown",ev=>{drawing=true;last=pos(ev);cv.setPointerCapture(ev.pointerId);});
  cv.addEventListener("pointermove",ev=>{if(!drawing)return;const p=pos(ev);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p;
    if(!S.hasSig){S.hasSig=true;updateCta();}});
  const end=()=>{if(drawing){drawing=false;S.sigImg=cv.toDataURL("image/png");}};
  cv.addEventListener("pointerup",end); cv.addEventListener("pointercancel",end);
}

  if(!S.modal) return "";
  const t={contrato:"Contrato de servicios",autorizacion:"Autorización general",solicitud:"Solicitud de incineración"}[S.modal];
  return `<div class="modal-bg" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-label="${t}" data-stop>
    <div class="modal-h"><h2>${t}</h2><button class="iconbtn" data-act="closeModal" aria-label="Cerrar">${I.x}</button></div>
    <div class="paper">${docPreview(S.modal,E())}</div></div></div>`;
}

/* ======================= Render raíz ======================= */
function render(){
  const app=document.getElementById("app");
  let html;
  if(S.view==="admin") html=renderAdmin();
  else if(S.screen==="landing") html=renderLanding();
  else if(S.screen==="login") html=renderLogin();
  else if(S.screen.startsWith("i-")) html=renderApp();
  else html=renderCheckout();
  app.innerHTML = html + (S.view==="admin"?"":renderModal()) + (S.toast?`<div class="toast" role="status">${I.check}${esc(S.toast)}</div>`:"");
  setupPad();
}
function updateCta(){
  const b=document.querySelector("[data-cta]"); if(!b) return;
  if(CO[S.screen]) b.disabled=!CO[S.screen]().cta.ok();
  else if(S.screen==="i-activar") b.disabled=!(E().f.fecha&&E().f.lugarTipo);
}
function toast(msg){ S.toast=msg; render(); clearTimeout(toast.t); toast.t=setTimeout(()=>{S.toast=null;render();},2800); }
function go(to){ S.screen=to; S.docOpen=null; S.modal=null; render(); window.scrollTo(0,0); }
function demoState(){
  const e=E();
  if(!e.zona){e.zona=e.cp.slice(0,2) in ZONAS?e.cp.slice(0,2):"28";}
  if(!e.mode) e.mode="prevision";
  if(!e.done.contacto){e.contacto.priv=true;e.done.contacto=true;log(e,"Área privada creada");}
  e.done.c=true; e.done.f=true; e.checks={a:true,b:true,c:true};
  if(!e.signed){e.signed=true;e.firmaFecha=todayEs();log(e,"3 documentos firmados con Signaturit");}
  if(e.dniC==="pendiente"){e.dniC="subido";log(e,"Tu DNI recibido");}
}
const findExp = id => allExp().find(e=>e.id===id);

document.addEventListener("click",ev=>{
  if(ev.target.closest("[data-stop]")&&!ev.target.closest("[data-act]")) return;
  const t=ev.target.closest("[data-act]"); if(!t||t.disabled) return;
  if(t.classList.contains("modal-bg")&&ev.target!==t) return;
  const a=t.dataset.act, v=t.dataset.val, e=E();
  switch(a){
    case "go": go(t.dataset.to); break;
    case "nav": go(v); break;
    case "task": go(v); break;
    case "toast": toast(v); break;
    case "set": setPath(t.dataset.path,v); render(); break;
    case "mode": e.mode=v; render(); break;
    case "scrollto": document.getElementById(v)?.scrollIntoView({behavior:"smooth",block:"start"}); break;
    case "focusCp": { const c=document.getElementById("calc"); c?.scrollIntoView({behavior:"smooth",block:"center"}); setTimeout(()=>document.getElementById("cp")?.focus({preventScroll:true}),350); break; }
    case "calc": { const k=e.cp.slice(0,2); S.calc = /^\d{5}$/.test(e.cp)&&ZONAS[k]?k:"none"; if(S.calc!=="none") e.zona=k; render(); document.getElementById("calc")?.scrollIntoView({behavior:"smooth",block:"center"}); break; }
    case "startFlow": go("presupuesto"); break;
    case "pickMode": e.mode=v; if(e.zona) go("presupuesto"); else { toast("Escribe tu código postal para ver el precio."); setTimeout(()=>{document.getElementById("calc")?.scrollIntoView({behavior:"smooth",block:"center"});document.getElementById("cp")?.focus({preventScroll:true});},50);} break;
    case "acceder": go(e.done.contacto?"i-inicio":"login"); break;
    case "demoArea": demoState(); go("i-inicio"); break;
    case "logout": go("landing"); break;
    case "gestor": location.hash="gestor"; break;
    case "crearCuenta": e.done.contacto=true; log(e,"Área privada creada · presupuesto "+fmt(Z().pvp)+" € ("+(e.mode==="inmediato"?"inmediato":"previsión")+")"); toast("Te hemos enviado el presupuesto por email."); go("contratante"); break;
    case "scan": if(t.dataset.who==="C"){e.scanC=true;e.dniC="subido";log(e,"Tu DNI recibido (escaneado)");} else {e.scanF=true;e.dniF="subido";log(e,"DNI de "+fname(e)+" recibido (escaneado)");} toast("Datos leídos del DNI. Revísalos."); break;
    case "saveC": e.done.c=true; log(e,"Datos del contratante completados"); go("fallecido"); break;
    case "saveF": e.done.f=true; log(e,"Documentos preparados con tus datos"); go("revision"); break;
    case "doc": S.docOpen = S.docOpen===v?null:v; render(); break;
    case "viewDoc": S.modal=v; render(); break;
    case "closeModal": S.modal=null; render(); break;
    case "clearSig": S.hasSig=false; S.sigImg=null; render(); break;
    case "firmar": e.signed=true; e.firmaFecha=todayEs(); e.sig=S.sigImg; log(e,"3 documentos firmados con Signaturit"); go("i-inicio"); toast("Documentos firmados. Ya estás en tu área privada."); break;
    case "sample": if(t.dataset.who==="C"){e.dniC="subido";e.dniCR="";} else {e.dniF="subido";e.dniFR="";} log(e,(t.dataset.who==="C"?"Tu DNI":"DNI de "+fname(e))+" recibido"); toast("Foto recibida. La revisaremos en breve."); break;
    case "activar": activar(); go("i-inicio"); toast("Servicio activado. Marta te llamará en unos minutos."); break;
    /* gestor */
    case "toLanding": location.hash=""; S.view="user"; go("landing"); break;
    case "atab": S.adminTab=v; render(); break;
    case "filter": S.filter=v; render(); break;
    case "sel": S.sel=v||null; S.reject=null; render(); break;
    case "validar": { const x=findExp(S.sel); x[t.dataset.who==="C"?"dniC":"dniF"]="validado"; log(x,(t.dataset.who==="C"?"DNI del contratante":"DNI del fallecido")+" validado por Marta R."); render(); break; }
    case "rechazar": S.reject = S.reject===S.sel+t.dataset.who?null:S.sel+t.dataset.who; render(); break;
    case "rechazo": { const x=findExp(S.sel), w=t.dataset.who; x[w==="C"?"dniC":"dniF"]="rechazado"; x[w==="C"?"dniCR":"dniFR"]=v; S.reject=null; log(x,(w==="C"?"DNI del contratante":"DNI del fallecido")+" rechazado: "+v.toLowerCase()); log(x,"Aviso enviado a la familia por WhatsApp y email"); toast2("Rechazado. La familia ya tiene el aviso en su área privada."); break; }
    case "recordar": { const x=findExp(S.sel); log(x,"Recordatorio enviado por WhatsApp"); toast2("Recordatorio enviado por WhatsApp."); break; }
    case "adminActivar": { const x=findExp(S.sel); if(!x.f.fecha)x.f.fecha=today(); if(!x.f.lugarTipo)x.f.lugarTipo="Hospital"; activar(x,"gestora"); toast2("Servicio activado y enviado a Salesforce."); break; }
  }
});
function toast2(msg){ render(); const d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.innerHTML=I.check+esc(msg); document.body.appendChild(d); setTimeout(()=>d.remove(),2800); }
document.addEventListener("keydown",ev=>{ const r=ev.target.closest&&ev.target.closest("tr[data-act]"); if(r&&(ev.key==="Enter"||ev.key===" ")){ev.preventDefault();r.click();} if(ev.key==="Escape"&&S.modal){S.modal=null;render();} });
document.addEventListener("input",ev=>{
  const t=ev.target; if(!t.dataset.bind) return;
  setPath(t.dataset.bind, t.type==="checkbox"?t.checked:t.value);
  if(t.dataset.bind==="$q"){ const pos=t.selectionStart; render(); const q=document.getElementById("q"); q.focus(); q.setSelectionRange(pos,pos); return; }
  updateCta();
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&ev.target.id==="cp"&&S.screen==="landing"){ev.preventDefault();document.querySelector('[data-act="calc"]')?.click();} });
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.bind&&t.type==="checkbox"){ setPath(t.dataset.bind,t.checked); updateCta(); }
  if(t.dataset.file&&t.files&&t.files[0]){ const w=t.dataset.file, e=E(); if(w==="C"){e.dniC="subido";e.dniCR="";} else {e.dniF="subido";e.dniFR="";} log(e,(w==="C"?"Tu DNI":"DNI de "+fname(e))+" recibido"); toast("Foto recibida. La revisaremos en breve."); }
});
function fromHash(){
  if(location.hash==="#gestor"){ S.view="admin"; }
  else { S.view="user"; if(location.hash==="#area"){ demoState(); S.screen="i-inicio"; } }
}
fromHash(); window.addEventListener("hashchange",()=>{fromHash();render();window.scrollTo(0,0);});
render();

</script>
</body>
</html>
